name: Automated Threat Scout

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run automated vendor threat scout
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-threats.mjs

      - name: Validate data contracts
        run: npm run validate:data

      - name: Commit and push updated threats.json
        run: |
          if git diff --quiet public/data/threats.json; then
            echo "No changes to public/data/threats.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/threats.json
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "chore(scout): update verified vendor threats [${TIMESTAMP}]"
          git pull --rebase origin main
          git push origin main
